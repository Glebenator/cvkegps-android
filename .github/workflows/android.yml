# Builds the Android app, runs lint and the unit tests, compiles the device tests, and builds the release APK and the
# release bundle for Google Play. CI has no upload key, so the release outputs are unsigned.
# The device tests need an emulator and are not in this workflow yet.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and unit tests
        # Without a Maps API key, the build uses a placeholder. The map is then empty, but the build and the tests work.
        run: >
          ./gradlew --stacktrace
          :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest :app:assembleRelease
          :app:bundleRelease
      - name: Upload the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
